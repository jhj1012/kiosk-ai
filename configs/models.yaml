# Shared model settings for the whole team.
# Per-machine overrides go in configs/models.local.yaml (git-ignored).
# The API key is NOT stored here: set GEMINI_API_KEY (see docs/setup.md).

llm:
  provider: gemini
  model: gemini-3.5-flash-lite         # fast (1-6 s per step in tests) and handled all scenarios
  # model: gemini-3.8-flash            # stronger agent model; was overloaded (~30 s) when tested
  # model: gemini-3.1-pro-preview      # strongest reasoning, slower, no free tier
  thinking_level: low       # minimal | low | medium | high: more thinking = smarter but slower
  temperature: 1.0          # Google recommends the default 1.0 for Gemini 3 models
  max_output_tokens: 2048   # per answer, thinking included; stops runaway answers
  timeout_s: 30             # give up on one request after this many seconds (then retry)
  api_key_env: GEMINI_API_KEY

# Speech recognition (--voice): a separate call on a DIFFERENT model than the agent, so it has
# its own rate-limit quota (free tier ~15 requests/min per model). One call per utterance.
stt:
  model: gemini-3.1-flash-lite   # see docs/decisions.md for the measurements
  thinking_level: minimal   # transcription needs no thinking; more only adds latency
  temperature: 1.0
  max_output_tokens: 512
  timeout_s: 15
  vocabulary_hints: true    # send the names on the kiosk screen (menu items) as spelling hints

tts:
  engine: pyttsx3           # Windows built-in speech (planned phase), no AI model to download
  voice: Heami              # Microsoft Heami (Korean), install via Windows language settings
  rate: 180
