# Shared model settings for the whole team.
# Per-machine overrides go in configs/models.local.yaml (git-ignored).

llm:
  provider: ollama
  host: http://localhost:11434
  model: qwen2.5:7b-instruct-q4_K_M      # 4-bit quantized, ~5 GB VRAM
  # model: qwen2.5:14b-instruct-q4_K_M   # better Korean, ~9 GB VRAM
  # model: qwen2.5:3b-instruct-q4_K_M    # weak machines
  temperature: 0.0
  num_ctx: 8192             # context window (tokens): system prompt + history + one screen
  num_predict: 400          # max tokens per answer; stops runaway generation
  keep_alive: 30m           # keep the model loaded between requests
  timeout_s: 120            # give up on one request after this many seconds

stt:
  engine: faster-whisper
  model: large-v3-turbo
  language: ko
  device: cuda              # cuda | cpu
  compute_type: int8_float16  # use int8 on cpu
  vad_filter: true

tts:
  engine: pyttsx3
  voice: Heami              # Microsoft Heami (Korean), install via Windows language settings
  rate: 180
