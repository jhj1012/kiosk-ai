# Runtime settings for the assistant.
# Per-machine overrides go in configs/settings.local.yaml (git-ignored).

target_window:
  title: "Test Kiosk"       # window title the assistant attaches to

screen:
  settle_timeout_s: 5.0     # after an action, wait at most this long for the screen to settle
  poll_interval_s: 0.1      # how often the screen is re-read while waiting

# Microphone and voice activity detection (--voice). Levels are the RMS of 16-bit samples;
# `uv run python scripts/mic_check.py --levels` shows them live.
audio:
  sample_rate: 16000
  device: null              # null = Windows default input; or an index / part of the name
                            # from `scripts/mic_check.py --list`
  frame_ms: 30              # 10, 20 or 30
  calibration_s: 1.0        # background noise is measured at start-up (stay quiet)
  threshold_factor: 3.0     # speech = this many times louder than the background noise
  min_threshold: 300        # ...and at least this loud
  start_ms: 150             # loud audio this long in a row starts an utterance
  pre_roll_ms: 300          # audio kept from before the start, so the first syllable is not cut
  silence_end_ms: 800       # quiet this long ends the utterance
  min_utterance_ms: 300     # shorter sounds (coughs, clicks) are dropped
  max_utterance_s: 15       # longer utterances are cut off here
  echo_tail_ms: 300         # keep ignoring the mic this long after the assistant stops speaking

agent:
  max_steps_per_request: 10   # LLM calls per user message (one call can do several actions)
  history_turns: 10           # customer turns kept for the LLM (oldest are dropped)
  # Next customer: a new conversation starts when the kiosk is back on its idle (start) screen
  # and nobody talked for new_customer_after_s, or when nobody talked for abandoned_after_s.
  new_customer_after_s: 30
  abandoned_after_s: 180
  confirm_before_payment: true   # guard the pay button (see below)
  # Irreversible buttons: regexes matched against the button name (case-insensitive).
  # Pay is pressed only after the user asked to pay, together with a read-back of the order and
  # total; discard only after the user said yes to a confirm question.
  # Per-kiosk configuration, like target_window.title.
  payment_button_pattern: "^(결제|결제 요청|pay)$"            # finishes the payment
  discard_button_pattern: "^(처음으로|전체 삭제|장바구니 전체 삭제|주문 취소)$"  # drops the order
