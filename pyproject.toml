[project]
name = "kiosk-ai"
version = "0.1.0"
description = "Voice AI assistant that operates an on-screen kiosk via Windows UI Automation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
kiosk = [
    "PySide6>=6.7",
]
assistant = [
    "pyttsx3>=2.98",
    "pywinauto>=0.6.9",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "google-genai>=2.27.0",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pre-commit>=3.8",
    "import-linter>=2.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false
default-groups = ["kiosk", "assistant", "dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["assistant", "kiosk_app"]

[[tool.importlinter.contracts]]
name = "assistant and kiosk_app are independent"
type = "independence"
modules = ["assistant", "kiosk_app"]
